name: build-snap
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: snapcore/action-build@v1
      id: snapcraft
    - uses: actions/upload-artifact@v4
      with:
        name: 'snap'
        path: ${{ steps.snapcraft.outputs.snap}}
  test:
    needs: snap
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        repository: canonical/gaming-graphics-test-suite
        path: tests/suite
    - uses: actions/download-artifact@v4
      with:
        name: 'snap'
        path: artifact
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y xvfb
    - name: Set up snaps
      run: |
        sudo snap install core26
        sudo snap install gaming-graphics-core26 --channel=kisak-fresh/stable
        sudo snap install --dangerous artifact/*.snap
        sudo snap connect steam:gaming-graphics-core26 gaming-graphics-core26:gaming-graphics-core26
        for plug in opengl x11 desktop home; do
          sudo snap connect "steam:$plug"
        done
    - name: Run tests
      run: |
        xvfb-run -a snap run --shell steam.steam -c "$PWD/tests/suite/src/run-all.sh"
